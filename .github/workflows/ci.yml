name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed runtime artifacts
        run: git diff --exit-code -- lib
      - run: npm run check:package
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-creative-studio-package
          path: dsh-creative-studio-*.tgz
          if-no-files-found: error
